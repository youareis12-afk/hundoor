<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بطاقة الطالب</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap');
:root{--ink:#0f1923;--paper:#f5f0e8;--accent:#c0392b;--gold:#d4a017;--muted:#7a6e5f;--card:#fffdf7}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Tajawal',sans-serif;background:var(--paper);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 16px 48px;background-image:repeating-linear-gradient(0deg,transparent,transparent 27px,rgba(0,0,0,.03) 28px),repeating-linear-gradient(90deg,transparent,transparent 27px,rgba(0,0,0,.03) 28px)}
.view{display:none;width:100%;max-width:460px;flex-direction:column;align-items:center}
.view.active{display:flex}
header{width:100%;text-align:center;margin-bottom:22px;padding-bottom:16px;border-bottom:3px double var(--ink);position:relative}
header::after{content:'';position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);width:70px;height:3px;background:var(--accent)}
.logo{font-size:40px;margin-bottom:4px}
h1{font-size:22px;font-weight:900;color:var(--ink)}
.sub{font-size:12px;color:var(--muted);margin-top:3px}
.tabs{display:flex;width:100%;background:var(--ink);border-radius:10px 10px 0 0}
.tb{flex:1;padding:11px 8px;background:transparent;border:none;color:rgba(255,255,255,.4);font-family:'Tajawal',sans-serif;font-size:14px;font-weight:700;cursor:pointer;border-bottom:3px solid transparent;transition:all .2s}
.tb.active{color:#fff;border-bottom-color:var(--gold);background:rgba(255,255,255,.07)}
.card{background:var(--card);width:100%;border-radius:0 0 14px 14px;padding:22px 18px;box-shadow:0 8px 28px rgba(0,0,0,.12);border:1px solid rgba(0,0,0,.06);border-top:none}
.pane{display:none}.pane.active{display:block}
.field{margin-bottom:14px}
label{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
input{width:100%;padding:10px 13px;border:2px solid #ddd8cc;border-radius:8px;font-family:'Tajawal',sans-serif;font-size:15px;background:#fff;color:var(--ink);outline:none;transition:border-color .2s}
input:focus{border-color:var(--accent)}
.btn{width:100%;padding:12px;background:var(--ink);color:#fff;border:none;border-radius:8px;font-family:'Tajawal',sans-serif;font-size:15px;font-weight:700;cursor:pointer;margin-top:4px;transition:background .2s}
.btn:hover{background:#1e2f3f}
.list-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.ltitle{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.bdg{background:var(--ink);color:#fff;padding:2px 10px;border-radius:100px;font-size:12px;font-weight:700}
.si{background:#fff;border:1.5px solid #ede9de;border-radius:10px;margin-bottom:9px;overflow:hidden}
.sr{display:flex;align-items:center;padding:12px 13px;justify-content:space-between}
.sn{font-weight:700;font-size:14px;color:var(--ink)}
.sm{font-size:11px;color:var(--muted);margin-top:2px}
.acts{display:flex;align-items:center;gap:7px}
.qbtn{background:var(--ink);color:#fff;border:none;border-radius:7px;padding:6px 13px;font-family:'Tajawal',sans-serif;font-size:12px;font-weight:700;cursor:pointer;transition:background .2s}
.qbtn:hover{background:var(--accent)}
.dbtn{background:none;border:none;color:#ccc;font-size:16px;cursor:pointer;padding:4px;border-radius:5px;transition:color .2s}
.dbtn:hover{color:var(--accent)}
.empty{text-align:center;padding:28px 0;color:var(--muted);font-size:13px;line-height:1.8}
.empty .ic{font-size:36px;margin-bottom:6px}
/* QR page */
#vq{align-items:center;text-align:center}
.back{align-self:flex-start;background:none;border:none;font-family:'Tajawal',sans-serif;font-size:14px;font-weight:700;color:var(--muted);cursor:pointer;padding:5px 0;margin-bottom:18px;display:flex;align-items:center;gap:5px}
.back:hover{color:var(--ink)}
.idc{background:var(--ink);color:#fff;border-radius:20px;padding:28px 24px;width:100%;max-width:300px;text-align:center;box-shadow:0 14px 42px rgba(0,0,0,.26);position:relative;overflow:hidden}
.idc::before{content:'';position:absolute;top:-40px;right:-40px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.04)}
.idc::after{content:'';position:absolute;bottom:-35px;left:-35px;width:110px;height:110px;border-radius:50%;background:rgba(192,57,43,.12)}
.ceye{font-size:9px;letter-spacing:3px;color:rgba(255,255,255,.3);text-transform:uppercase;margin-bottom:7px;position:relative;z-index:1}
.cname{font-size:20px;font-weight:900;margin-bottom:3px;position:relative;z-index:1}
.cinfo{font-size:11px;color:rgba(255,255,255,.4);margin-bottom:18px;position:relative;z-index:1}
.qframe{display:inline-block;background:#fff;padding:10px;border-radius:12px;box-shadow:0 3px 16px rgba(0,0,0,.28);margin-bottom:15px;position:relative;z-index:1}
.qframe canvas{display:block}
.cidbdg{display:inline-block;background:var(--gold);color:var(--ink);padding:4px 18px;border-radius:100px;font-size:13px;font-weight:700;letter-spacing:1px;position:relative;z-index:1}
.hint{margin-top:18px;width:100%;max-width:300px;background:rgba(0,0,0,.05);border-radius:10px;padding:10px 14px;font-size:12px;color:var(--muted);line-height:1.7;border:1px solid rgba(0,0,0,.06)}
</style>
</head>
<body>

<div id="vm" class="view active">
  <header>
    <div class="logo">🎓</div>
    <h1>بطاقة الطالب</h1>
    <p class="sub">سجّل مرة واحدة — باركودك دائماً معك</p>
  </header>
  <div class="tabs">
    <button class="tb active" onclick="stab('reg',this)">➕ تسجيل</button>
    <button class="tb" onclick="stab('lst',this)">👥 الطلاب</button>
  </div>
  <div class="card">
    <div class="pane active" id="pane-reg">
      <div class="field"><label>الاسم الكامل</label><input id="fn" placeholder="أحمد محمد علي"></div>
      <div class="field"><label>رقم الطالب</label><input id="fi" placeholder="2024001"></div>
      <div class="field"><label>الصف / الشعبة</label><input id="fc" placeholder="الصف الثالث - أ"></div>
      <div class="field"><label>المادة</label><input id="fs" placeholder="الرياضيات"></div>
      <button class="btn" onclick="reg()">🪪 تسجيل وإنشاء الباركود</button>
    </div>
    <div class="pane" id="pane-lst">
      <div class="list-hd"><span class="ltitle">الطلاب المسجلون</span><span class="bdg" id="cnt">0</span></div>
      <div id="lst"></div>
    </div>
  </div>
</div>

<div id="vq" class="view">
  <button class="back" onclick="back()">← رجوع</button>
  <div class="idc">
    <div class="ceye">بطاقة الحضور</div>
    <div class="cname" id="qn">—</div>
    <div class="cinfo" id="qi">—</div>
    <div class="qframe"><canvas id="qc"></canvas></div><br>
    <div class="cidbdg" id="qid">—</div>
  </div>
  <div class="hint">📱 اعرض هذا الباركود للأستاذ عند الحضور<br>يعمل بدون إنترنت في أي وقت</div>
</div>

<script>
var SS=JSON.parse(localStorage.getItem('students')||'[]');

function stab(t,b){
  document.querySelectorAll('.pane').forEach(function(p){p.classList.remove('active');});
  document.querySelectorAll('.tb').forEach(function(x){x.classList.remove('active');});
  document.getElementById('pane-'+t).classList.add('active');
  b.classList.add('active');
  if(t==='lst')render();
}

function reg(){
  var n=document.getElementById('fn').value.trim();
  var i=document.getElementById('fi').value.trim();
  var c=document.getElementById('fc').value.trim();
  var s=document.getElementById('fs').value.trim();
  if(!n||!i){alert('أدخل الاسم ورقم الطالب');return;}
  if(SS.find(function(x){return x.id===i;})){alert('الرقم مسجل مسبقاً');return;}
  var st={name:n,id:i,class:c,subject:s};
  SS.push(st);save();
  ['fn','fi','fc','fs'].forEach(function(x){document.getElementById(x).value='';});
  showQR(st);
}

function showQR(s){
  document.getElementById('qn').textContent=s.name;
  document.getElementById('qid').textContent=s.id;
  document.getElementById('qi').textContent=[s.class,s.subject].filter(Boolean).join(' • ')||' ';
  var cv=document.getElementById('qc');
  QrCreator.render({text:JSON.stringify({id:s.id,name:s.name,class:s.class,subject:s.subject}),radius:.1,ecLevel:'M',fill:'#000',background:'#fff',size:200},cv);
  document.getElementById('vm').classList.remove('active');
  document.getElementById('vq').classList.add('active');
  window.scrollTo(0,0);
}

function back(){
  document.getElementById('vq').classList.remove('active');
  document.getElementById('vm').classList.add('active');
  document.querySelectorAll('.pane').forEach(function(p){p.classList.remove('active');});
  document.querySelectorAll('.tb').forEach(function(b){b.classList.remove('active');});
  document.getElementById('pane-lst').classList.add('active');
  document.querySelectorAll('.tb')[1].classList.add('active');
  render();
}

function render(){
  var el=document.getElementById('lst');
  document.getElementById('cnt').textContent=SS.length;
  if(!SS.length){el.innerHTML='<div class="empty"><div class="ic">📋</div>لا يوجد طلاب بعد<br>اضغط تسجيل لإضافة طالب</div>';return;}
  el.innerHTML=SS.map(function(s,i){return'<div class="si"><div class="sr"><div><div class="sn">'+s.name+'</div><div class="sm">'+s.id+(s.class?' • '+s.class:'')+'</div></div><div class="acts"><button class="qbtn" onclick="showQR(SS['+i+'])">📲 باركودي</button><button class="dbtn" onclick="del(event,'+i+')">🗑</button></div></div></div>';}).join('');
}

function del(e,i){
  e.stopPropagation();
  if(confirm('حذف '+SS[i].name+'؟')){SS.splice(i,1);save();render();}
}
function save(){localStorage.setItem('students',JSON.stringify(SS));}
render();
</script>
