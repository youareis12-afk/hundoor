<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام الحضور</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap');
:root{--bg:#0d1117;--surface:#161b22;--surface2:#1c2128;--border:#30363d;--green:#3fb950;--green-dim:rgba(63,185,80,0.12);--red:#f85149;--red-dim:rgba(248,81,73,0.12);--gold:#d29922;--blue:#58a6ff;--text:#e6edf3;--muted:#7d8590}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px 14px}

/* LOGIN */
#login-screen{max-width:380px;margin:60px auto;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:32px 24px;text-align:center}
#login-screen h2{font-size:20px;font-weight:900;margin-bottom:6px}
#login-screen p{font-size:13px;color:var(--muted);margin-bottom:24px}
.login-field{margin-bottom:14px;text-align:right}
.login-field label{display:block;font-size:11px;color:var(--muted);font-weight:700;margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px}
.login-field input{width:100%;padding:11px 13px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'Tajawal',sans-serif;font-size:14px;outline:none}
.login-field input:focus{border-color:var(--blue)}
#login-err{color:var(--red);font-size:13px;margin-bottom:12px;min-height:18px}

/* HEADER */
header{max-width:520px;margin:0 auto 20px;display:flex;align-items:center;justify-content:space-between}
.header-title h1{font-size:20px;font-weight:900}
.header-title p{font-size:11px;color:var(--muted);margin-top:2px}
.header-right{display:flex;gap:8px;align-items:center}
.date-badge{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:5px 10px;font-size:11px;color:var(--muted);text-align:center}
.date-badge strong{display:block;color:var(--gold);font-size:13px}
.logout-btn{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 12px;color:var(--muted);font-family:'Tajawal',sans-serif;font-size:12px;font-weight:700;cursor:pointer}

.nav{max-width:520px;margin:0 auto 16px;display:flex;background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.nav-btn{flex:1;padding:11px 6px;background:transparent;border:none;color:var(--muted);font-family:'Tajawal',sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:all .2s;border-left:1px solid var(--border)}
.nav-btn:last-child{border-left:none}
.nav-btn.active{color:var(--text);background:var(--surface2)}
.main{max-width:520px;margin:0 auto}
.pane{display:none}.pane.active{display:block}

/* SCANNER */
.scanner-box{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:16px}
.scanner-header{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.scanner-header .title{font-weight:700;font-size:15px}
.scanner-header .subtitle{font-size:12px;color:var(--muted);margin-top:2px}
.scan-status{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:100px;font-size:12px;font-weight:700}
.scan-status.on{background:var(--green-dim);color:var(--green)}
.scan-status.off{background:var(--red-dim);color:var(--red)}
.scan-status::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor}
#reader{width:100%;min-height:200px}
#reader video{width:100%!important;border-radius:0}
.scan-controls{padding:14px 18px;display:flex;gap:10px}

.btn{flex:1;padding:11px 14px;border:none;border-radius:8px;font-family:'Tajawal',sans-serif;font-size:14px;font-weight:700;cursor:pointer;transition:opacity .2s,transform .1s}
.btn:active{transform:scale(.97)}
.btn-green{background:var(--green);color:#000}
.btn-red{background:var(--red);color:#fff}
.btn-blue{background:var(--blue);color:#000}
.btn-dim{background:var(--surface2);color:var(--muted);border:1px solid var(--border)}
.btn-full{width:100%}

.setup-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px 18px;margin-bottom:16px}
.setup-card h3{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:14px}
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;color:var(--muted);font-weight:700;margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px}
input[type=text],input[type=date],select{width:100%;padding:10px 13px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'Tajawal',sans-serif;font-size:14px;outline:none;transition:border-color .2s}
input:focus,select:focus{border-color:var(--blue)}
select option{background:var(--bg)}

.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 12px;text-align:center}
.stat-card .val{font-size:26px;font-weight:900}
.stat-card .lbl{font-size:11px;color:var(--muted);margin-top:2px}
.stat-card.green{border-color:rgba(63,185,80,.4)}.stat-card.green .val{color:var(--green)}
.stat-card.red{border-color:rgba(248,81,73,.3)}.stat-card.red .val{color:var(--red)}

.att-list-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.att-list-header h3{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.att-item{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;background:var(--surface);border:1px solid var(--border);border-radius:9px;margin-bottom:8px}
.att-item.present{border-right:3px solid var(--green)}
.att-item.absent{border-right:3px solid var(--red);opacity:.6}
.att-item .att-name{font-weight:700;font-size:14px}
.att-item .att-meta{font-size:11px;color:var(--muted);margin-top:2px}
.att-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:100px;font-size:11px;font-weight:700}
.att-badge.p{background:var(--green-dim);color:var(--green)}
.att-badge.a{background:var(--red-dim);color:var(--red)}

.manual-entry{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin-bottom:16px}
.manual-entry h3{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}
.manual-row{display:flex;gap:10px}

.session-item{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:10px}
.session-item .s-title{font-weight:700;font-size:15px}
.session-item .s-meta{font-size:12px;color:var(--muted);margin-top:2px}
.session-item .s-bar{height:6px;border-radius:3px;overflow:hidden;margin-top:10px;background:var(--border)}
.session-item .s-bar .fill{height:100%;background:var(--green);transition:width .5s}
.session-item .s-footer{display:flex;align-items:center;justify-content:space-between;margin-top:8px;gap:6px}
.session-item .s-counts{font-size:12px;color:var(--muted);flex:1}
.s-export-xl{background:none;border:1px solid var(--green);border-radius:6px;color:var(--green);padding:4px 10px;font-family:'Tajawal',sans-serif;font-size:12px;cursor:pointer}

.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-80px);background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:14px 20px;text-align:center;min-width:260px;z-index:999;transition:transform .35s cubic-bezier(.34,1.56,.64,1);box-shadow:0 8px 32px rgba(0,0,0,.4)}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.success{border-color:var(--green)}.toast.error{border-color:var(--red)}.toast.warn{border-color:var(--gold)}
.toast .t-icon{font-size:28px;margin-bottom:4px}
.toast .t-name{font-size:17px;font-weight:900}
.toast .t-info{font-size:12px;color:var(--muted);margin-top:2px}

.empty{text-align:center;padding:40px 0;color:var(--muted)}
.empty .e-icon{font-size:38px;margin-bottom:10px}
.loading{text-align:center;padding:30px;color:var(--muted);font-size:14px}

.teacher-badge{background:rgba(88,166,255,.1);border:1px solid rgba(88,166,255,.3);border-radius:8px;padding:8px 14px;font-size:12px;color:var(--blue);margin-bottom:14px}
</style>
</head>
<body>

<!-- ═══ شاشة تسجيل الدخول ═══ -->
<div id="login-screen">
  <div style="font-size:42px;margin-bottom:10px">📡</div>
  <h2>نظام الحضور الجامعي</h2>
  <p>سجّل دخولك كأستاذ</p>
  <div class="login-field">
    <label>الاسم الكامل</label>
    <input type="text" id="l-name" placeholder="د. أحمد محمد">
  </div>
  <div class="login-field">
    <label>القسم / الكلية</label>
    <input type="text" id="l-dept" placeholder="قسم الحاسبات - كلية الهندسة">
  </div>
  <div id="login-err"></div>
  <button class="btn btn-green btn-full" onclick="doLogin()">دخول ▶</button>
</div>

<!-- ═══ التطبيق الرئيسي ═══ -->
<div id="app-screen" style="display:none">

<header>
  <div class="header-title">
    <h1>📡 الحضور</h1>
    <p id="teacher-label">—</p>
  </div>
  <div class="header-right">
    <div class="date-badge">
      <strong id="today-date">—</strong>
      <span id="today-day">—</span>
    </div>
    <button class="logout-btn" onclick="doLogout()">خروج</button>
  </div>
</header>

<div class="nav">
  <button class="nav-btn active" onclick="switchPane('scan',event)">📷 مسح</button>
  <button class="nav-btn" onclick="switchPane('attendance',event)">📋 الحضور</button>
  <button class="nav-btn" onclick="switchPane('sessions',event)">🗂 السجلات</button>
</div>

<div class="main">

  <!-- PANE: SCAN -->
  <div class="pane active" id="pane-scan">
    <div class="teacher-badge" id="teacher-badge">👤 —</div>

    <div class="setup-card">
      <h3>⚙️ إعداد الحصة</h3>
      <div class="field">
        <label>اسم المادة</label>
        <input type="text" id="session-name" placeholder="مثال: الرياضيات - المرحلة الثالثة">
      </div>
      <div class="field">
        <label>التاريخ</label>
        <input type="date" id="session-date">
      </div>
    </div>

    <div class="scanner-box">
      <div class="scanner-header">
        <div>
          <div class="title">📷 مسح الباركود</div>
          <div class="subtitle">وجّه الكاميرا على QR code الطالب</div>
        </div>
        <div class="scan-status off" id="scan-indicator">متوقف</div>
      </div>
      <div id="reader"></div>
      <div class="scan-controls">
        <button class="btn btn-green" onclick="startScan()">▶ تشغيل</button>
        <button class="btn btn-red"   onclick="stopScan()">⏹ إيقاف</button>
      </div>
    </div>

    <div class="manual-entry">
      <h3>✏️ إدخال يدوي</h3>
      <div class="manual-row">
        <input type="text" id="manual-id" placeholder="رقم الطالب...">
        <button class="btn btn-dim" style="flex:0;white-space:nowrap" onclick="manualAttend()">تسجيل</button>
      </div>
    </div>

    <div class="stats-row">
      <div class="stat-card green"><div class="val" id="s-present">0</div><div class="lbl">حاضر</div></div>
      <div class="stat-card red"><div class="val" id="s-absent">0</div><div class="lbl">غائب</div></div>
      <div class="stat-card"><div class="val" id="s-total">0</div><div class="lbl">مجموع</div></div>
    </div>

    <div style="display:flex;gap:10px">
      <button class="btn btn-green" style="flex:2" onclick="saveSession()">💾 حفظ الحصة</button>
      <button class="btn btn-dim"   style="flex:1" onclick="clearAttendance()">🗑 مسح</button>
    </div>
  </div>

  <!-- PANE: ATTENDANCE -->
  <div class="pane" id="pane-attendance">
    <div class="att-list-header">
      <h3>سجل الحضور الحالي</h3>
    </div>
    <div id="att-list"></div>
  </div>

  <!-- PANE: SESSIONS -->
  <div class="pane" id="pane-sessions">
    <div class="att-list-header">
      <h3>سجلاتي المحفوظة</h3>
    </div>
    <div id="sessions-list"></div>
  </div>

</div>
</div>

<!-- TOAST -->
<div class="toast" id="toast">
  <div class="t-icon" id="t-icon">✅</div>
  <div class="t-name" id="t-name">—</div>
  <div class="t-info" id="t-info">—</div>
</div>

<!-- Firebase -->
<script type="module">
import { initializeApp }         from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, query, where, Timestamp }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAIejJylMFIpsI4E4x8i_nv5KUVmdc5IMY",
  authDomain: "hudoor-uni.firebaseapp.com",
  projectId: "hudoor-uni",
  storageBucket: "hudoor-uni.firebasestorage.app",
  messagingSenderId: "847527072323",
  appId: "1:847527072323:web:f90ec5ec5d07de5d3b3af6"
};

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);

// ── نجعل db متاحة للكود العادي ──
window._db = db;
window._col = (name) => collection(db, name);
window._addDoc = addDoc;
window._getDocs = getDocs;
window._query = query;
window._where = where;
window._Timestamp = Timestamp;

window.dispatchEvent(new Event('firebase-ready'));
</script>

<script>
// ─── State ───────────────────────────────────────────────
let attendance = {};   // { studentId: { name, class, subject, time, present } }
let scanner    = null;
let scanning   = false;
let currentTeacher = null;  // { name, dept }
let sessions   = [];

// ─── انتظر Firebase ──────────────────────────────────────
window.addEventListener('firebase-ready', () => {
  console.log('Firebase جاهز ✅');
});

// ─── تاريخ اليوم ─────────────────────────────────────────
(function(){
  const now  = new Date();
  const days = ['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
  document.getElementById('today-date').textContent = now.toLocaleDateString('ar-IQ');
  document.getElementById('today-day').textContent  = days[now.getDay()];
  document.getElementById('session-date').value     = now.toISOString().split('T')[0];
})();

// ─── تسجيل الدخول ────────────────────────────────────────
function doLogin() {
  const name = document.getElementById('l-name').value.trim();
  const dept = document.getElementById('l-dept').value.trim();
  const err  = document.getElementById('login-err');

  if (!name || !dept) { err.textContent = 'الرجاء إدخال الاسم والقسم'; return; }

  currentTeacher = { name, dept };
  localStorage.setItem('teacher', JSON.stringify(currentTeacher));

  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app-screen').style.display   = 'block';
  document.getElementById('teacher-label').textContent  = name + ' — ' + dept;
  document.getElementById('teacher-badge').textContent  = '👤 ' + name + ' | ' + dept;

  loadSessions();
}

function doLogout() {
  currentTeacher = null;
  localStorage.removeItem('teacher');
  attendance = {};
  sessions   = [];
  document.getElementById('login-screen').style.display = 'block';
  document.getElementById('app-screen').style.display   = 'none';
  document.getElementById('l-name').value = '';
  document.getElementById('l-dept').value = '';
  stopScan();
}

// استعادة جلسة سابقة إذا موجودة
(function(){
  const saved = localStorage.getItem('teacher');
  if (saved) {
    document.getElementById('l-name').value = JSON.parse(saved).name;
    document.getElementById('l-dept').value = JSON.parse(saved).dept;
  }
})();

// ─── Navigation ──────────────────────────────────────────
function switchPane(name, e) {
  document.querySelectorAll('.pane').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('pane-' + name).classList.add('active');
  if (e && e.target) e.target.classList.add('active');
  if (name === 'attendance') renderAttendance();
  if (name === 'sessions')   renderSessions();
}

// ─── Scanner ─────────────────────────────────────────────
async function startScan() {
  if (scanning) return;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    stream.getTracks().forEach(t => t.stop());
  } catch {
    showToast('⚠️','الكاميرا غير متاحة','تأكد من إعطاء الإذن في المتصفح','warn');
    return;
  }
  try {
    scanner = new Html5Qrcode("reader");
    await scanner.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: { width: 230, height: 230 } },
      onScan, () => {}
    );
    scanning = true;
    setIndicator(true);
  } catch(err) {
    showToast('⚠️','خطأ',err.message,'warn');
  }
}

async function stopScan() {
  if (!scanning || !scanner) return;
  try { await scanner.stop(); } catch(e) {}
  scanning = false;
  setIndicator(false);
}

function setIndicator(on) {
  const el = document.getElementById('scan-indicator');
  el.textContent = on ? 'يعمل' : 'متوقف';
  el.className   = 'scan-status ' + (on ? 'on' : 'off');
}

// ─── QR Decoded ──────────────────────────────────────────
function onScan(data) {
  let student;
  try { student = JSON.parse(data); }
  catch { student = { id: data, name: data }; }

  const id = student.id;
  if (!id) return;

  if (attendance[id]) {
    showToast('⚠️', student.name || id, 'تم تسجيل حضوره مسبقاً', 'warn');
    return;
  }
  markPresent(id, student.name || id, student.class || '', student.subject || '', true);
}

// ─── Manual ──────────────────────────────────────────────
function manualAttend() {
  const id = document.getElementById('manual-id').value.trim();
  if (!id) return;
  if (attendance[id]) { showToast('⚠️', id, 'مسجل مسبقاً', 'warn'); return; }
  markPresent(id, id, '', '', false);
  document.getElementById('manual-id').value = '';
}

// ─── Mark Present ────────────────────────────────────────
function markPresent(id, name, cls, subject, fromScan) {
  attendance[id] = {
    id, name,
    class: cls,
    subject: subject,
    time: new Date().toLocaleTimeString('ar-IQ'),
    present: true
  };
  updateStats();
  showToast('✅', name,
    `${cls ? cls + ' • ' : ''}${fromScan ? 'QR' : 'يدوي'} • ${attendance[id].time}`,
    'success'
  );
}

// ─── Stats ───────────────────────────────────────────────
function updateStats() {
  const list = Object.values(attendance);
  const pres = list.filter(a => a.present).length;
  document.getElementById('s-present').textContent = pres;
  document.getElementById('s-absent').textContent  = 0;
  document.getElementById('s-total').textContent   = list.length;
}

function clearAttendance() {
  if (!confirm('مسح سجل الحضور الحالي؟')) return;
  attendance = {};
  updateStats();
  renderAttendance();
}

// ─── Save Session to Firebase ────────────────────────────
async function saveSession() {
  if (!window._db) { showToast('⚠️','Firebase','جاري التحميل...','warn'); return; }

  const name    = document.getElementById('session-name').value.trim() || 'حصة بدون اسم';
  const date    = document.getElementById('session-date').value;
  const records = Object.values(attendance);
  const present = records.filter(r => r.present);

  if (!present.length) {
    showToast('⚠️','لا يوجد حضور','سجّل حضور الطلاب أولاً','warn');
    return;
  }

  try {
    await window._addDoc(window._col('sessions'), {
      teacherName: currentTeacher.name,
      teacherDept: currentTeacher.dept,
      sessionName: name,
      date:        date,
      records:     records,
      presentCount:present.length,
      totalCount:  records.length,
      createdAt:   window._Timestamp.now()
    });

    // أضف للقائمة المحلية
    sessions.unshift({ teacherName: currentTeacher.name, teacherDept: currentTeacher.dept,
      sessionName: name, date, records, presentCount: present.length, totalCount: records.length });
    showToast('💾','تم الحفظ',`${name} - ${present.length} طالب — محفوظ على السيرفر ✅`,'success');
  } catch(e) {
    showToast('❌','خطأ في الحفظ', e.message, 'error');
  }
}

// ─── Load Sessions from Firebase ─────────────────────────
async function loadSessions() {
  if (!window._db) {
    setTimeout(loadSessions, 800);
    return;
  }
  try {
    const q   = window._query(
      window._col('sessions'),
      window._where('teacherName','==', currentTeacher.name),
      window._where('teacherDept','==', currentTeacher.dept)
    );
    const snap = await window._getDocs(q);
    sessions = [];
    snap.forEach(doc => sessions.push({ id: doc.id, ...doc.data() }));
    sessions.sort((a,b) => (b.createdAt?.seconds||0) - (a.createdAt?.seconds||0));
  } catch(e) {
    console.warn('خطأ تحميل الجلسات:', e);
  }
}

// ─── Render Attendance ───────────────────────────────────
function renderAttendance() {
  const el      = document.getElementById('att-list');
  const records = Object.values(attendance);
  if (!records.length) {
    el.innerHTML = `<div class="empty"><div class="e-icon">📭</div><p>لا يوجد سجل حضور بعد</p></div>`;
    return;
  }
  el.innerHTML = records.map(r => `
    <div class="att-item present">
      <div>
        <div class="att-name">${r.name}</div>
        <div class="att-meta">${r.id}${r.class?' • '+r.class:''}${r.subject?' • '+r.subject:''} • ${r.time}</div>
      </div>
      <span class="att-badge p">✔ حاضر</span>
    </div>
  `).join('');
}

// ─── Render Sessions ─────────────────────────────────────
function renderSessions() {
  const el = document.getElementById('sessions-list');
  if (!sessions.length) {
    el.innerHTML = `<div class="loading">⏳ جاري تحميل السجلات...</div>`;
    loadSessions().then(() => {
      if (!sessions.length)
        el.innerHTML = `<div class="empty"><div class="e-icon">🗂</div><p>لا توجد حصص محفوظة بعد</p></div>`;
      else renderSessions();
    });
    return;
  }
  el.innerHTML = sessions.map((s, i) => {
    const pct = s.totalCount ? Math.round(s.presentCount / s.totalCount * 100) : 0;
    return `
      <div class="session-item">
        <div class="s-title">${s.sessionName}</div>
        <div class="s-meta">${s.date} • ${s.teacherDept}</div>
        <div class="s-bar"><div class="fill" style="width:${pct}%"></div></div>
        <div class="s-footer">
          <span class="s-counts">حاضر: ${s.presentCount} من ${s.totalCount} (${pct}%)</span>
          <button class="s-export-xl" onclick="exportExcel(${i})">📊 Excel</button>
        </div>
      </div>
    `;
  }).join('');
}

// ─── Export Excel ────────────────────────────────────────
function exportExcel(i) {
  const s = sessions[i];
  if (!s || !s.records) return;

  const present = s.records.filter(r => r.present);
  const absent  = s.records.filter(r => !r.present);

  // بيانات الورقة
  const rows = [
    ['رقم', 'الاسم', 'رقم الطالب', 'الصف', 'المادة', 'وقت الحضور', 'الحالة']
  ];

  present.forEach((r, n) => {
    rows.push([n+1, r.name, r.id, r.class||'—', r.subject||'—', r.time, 'حاضر ✅']);
  });
  absent.forEach((r, n) => {
    rows.push([present.length + n + 1, r.name, r.id, r.class||'—', r.subject||'—', '—', 'غائب ❌']);
  });

  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet(rows);

  // عرض الأعمدة
  ws['!cols'] = [
    {wch:5},{wch:22},{wch:12},{wch:18},{wch:16},{wch:12},{wch:10}
  ];

  // معلومات في أعلى الملف
  const infoRows = [
    ['كشف الحضور'],
    ['الأستاذ:', s.teacherName],
    ['القسم:', s.teacherDept],
    ['المادة:', s.sessionName],
    ['التاريخ:', s.date],
    ['الحاضرون:', s.presentCount],
    ['المجموع:', s.totalCount],
    []
  ];
  const wsInfo = XLSX.utils.aoa_to_sheet([...infoRows, ...rows]);
  wsInfo['!cols'] = [{wch:5},{wch:22},{wch:12},{wch:18},{wch:16},{wch:12},{wch:10}];

  XLSX.utils.book_append_sheet(wb, wsInfo, 'كشف الحضور');
  XLSX.writeFile(wb, `حضور-${s.sessionName}-${s.date}.xlsx`);
}

// ─── Toast ───────────────────────────────────────────────
let toastTimer;
function showToast(icon, name, info, type) {
  const el = document.getElementById('toast');
  document.getElementById('t-icon').textContent = icon;
  document.getElementById('t-name').textContent = name;
  document.getElementById('t-info').textContent = info;
  el.className = `toast show ${type}`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = 'toast'; }, 3000);
}

updateStats();
</script>
